<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIVA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TIVA">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:#f3f5f4;color:#1c2b27;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:linear-gradient(160deg,#0f6e5f,#0a4d43);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 26px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(10,77,67,.25)}
  .hrow{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
  header .logo{background:#fff;border-radius:12px;padding:6px 10px;flex:0 0 auto}
  header .logo img{height:30px;display:block}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.3px;line-height:1.1}
  header p{margin:3px 0 0;font-size:13px;opacity:.85}
  header button{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 11px;font-size:12px;white-space:nowrap}
  .lista{max-width:640px;margin:0 auto;padding:16px 14px 10px;display:grid;gap:12px}
  @media(min-width:820px){.lista{max-width:960px;grid-template-columns:1fr 1fr}}
  a.card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 14px 14px 12px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(16,40,35,.07);border:1px solid #e6ebe9;transition:transform .08s}
  a.card:active{transform:scale(.985);background:#fafcfb}
  a.card .ic{flex:0 0 58px;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  a.card .tx{flex:1;min-width:0}
  a.card b{display:block;font-size:17px;font-weight:800;line-height:1.2;color:#15302a}
  a.card small{display:block;margin-top:4px;font-size:13px;line-height:1.3;color:#5b6b67}
  a.card .ch{flex:0 0 auto;color:#b7c3bf;font-size:22px;font-weight:300}
  .sucs{max-width:520px;margin:0 auto;padding:18px 14px}
  .sucs button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e6ebe9;border-radius:16px;padding:16px;margin:0 0 10px;font-size:17px;font-weight:800;color:#0f6e5f;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .tip{max-width:640px;margin:0 auto;padding:6px 18px 30px;font-size:12px;color:#8a9793;text-align:center}
  /* 18/10 (Daniel): cartel para instalar la app y activar los avisos con sonido */
  .panel{max-width:640px;margin:14px auto 0;padding:0 14px;display:grid;gap:10px}
  @media(min-width:820px){.panel{max-width:960px;grid-template-columns:1fr 1fr}}
  .pc{display:flex;align-items:center;gap:12px;background:#fff7e0;border:1px solid #f1dfa6;border-radius:16px;padding:12px 14px}
  .pc.ok{background:#e8f7ee;border-color:#b9e3c8}
  .pc .pi{font-size:26px;flex:0 0 auto}
  .pc .pt{flex:1;min-width:0}
  .pc b{display:block;font-size:14.5px;color:#2b2b2b;line-height:1.25}
  .pc small{display:block;margin-top:2px;font-size:12px;color:#6b6b6b;line-height:1.3}
  .pc button{flex:0 0 auto;background:#0f6e5f;color:#fff;border:0;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;white-space:nowrap}
  .pc.ok button{background:#fff;color:#1b7f5f;border:1px solid #b9e3c8}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
  .modal .bx{background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px}
  .modal h2{margin:0 0 10px;font-size:18px}
  .modal ol{margin:0;padding-left:20px;font-size:15px;line-height:1.6}
  .modal button{margin-top:16px;width:100%;background:#0f6e5f;color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
  .aviso{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:#15302a;color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:10;display:none;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script>
/* TIVA Sucursales — todos los links de cada local en un solo lugar (18/10/2026, pedido de Daniel).
   Los textos de cada botón son los que escribió Daniel. Para sumar un botón: agregarlo en BOTONES. Para sumar una sucursal: en SUCS. */
var CHAT = 'https://script.google.com/macros/s/AKfycbxrj6Yc4gvX3lBWh7uT0jy4tqE8wGdCNw_tTn82oVaMA-PmnKTnWh1WQbMTaAp0FjqZ/exec?email=';
var SUCS = {
  'RECOVA': 'tiva.recova@gmail.com',
  'BERAJA': 'sandobalberaja@gmail.com',
  'CONSTITUCION': 'consti.ab07@gmail.com',
  'SOFIA CELL CONSTITUCION': 'sofiativa15@gmail.com',
  'RETIRO SAN MARTIN': 'retirosanmartin454@gmail.com',
  'RETIRO RAMOS MEJIA': 'retiro.40ramos@gmail.com',
  'RIVADAVIA CENTER': 'centerrivadavia406@gmail.com',
  'RIVADAVIA 2525 CENTRAL': 'tivariva25@gmail.com'
};
function as(id, n, v){ return 'https://www.appsheet.com/start/' + id + '#appName=' + encodeURIComponent(n) + '&view=' + encodeURIComponent(v); }
function chat(s, canal){ return CHAT + encodeURIComponent(SUCS[s]) + (canal ? '&canal=' + canal : ''); }
var ENV = ['19837385-4f51-4fbf-9fda-9a7c8eb14eba', 'TIVAREMITO--3-57683989'];
var TRF = ['65e98873-94f5-4f1d-ad00-b6a5b04a803f', 'TIVA—CHECKLISTDIARIO-57683989'];
var FUN = ['2740cbb9-73cc-4984-bc01-2b15ba4cb81a', 'TIVAFUNDASV2-57683989'];
var BOTONES = [
  { t: 'Abrir mi turno', e: '⏰', s: 'Cerrar mi turno, poner tu nombre y abrir DUX Software', c: '#1b7f5f', u: function(s){ return chat(s, 'CAJA'); } },
  { t: 'Tomar foto a las transferencias', e: '📷', s: 'Acá está la app para detectar que los pagos llegan al banco', c: '#7b2cbf', u: function(){ return as(TRF[0], TRF[1], 'NUEVO COMPROBANTE'); } },
  { t: 'Reporte del local diario', e: '📝', s: 'Informar lo que pide la app, para que el local esté ordenado y limpio', c: '#2d3436', u: function(s){ return chat(s, 'IMPECABLE'); } },
  { t: 'Envíos y pedidos al depósito', e: '📦', s: 'Pedir y confirmar mercadería que te llegó, así evitamos que se pierda la mercadería en el camino', c: '#5a189a', u: function(){ return as(ENV[0], ENV[1], 'RECIBIR CON CELULAR'); } },
  { t: 'Fundas personalizadas', e: '🎨', s: 'Informemos al depósito que recibimos funda personalizada para hacer. Ofrezcamos personalizar cuando no encuentre su diseño el cliente', c: '#9d4edd', u: function(){ return as(FUN[0], FUN[1], 'PEDIDOS'); } },
  { t: 'Stock de la sucursal', e: '📊', s: 'Consultalo a la IA para que te diga cuántas unidades te quedan en stock de cualquier producto del local, y ahí mismo seleccioná para hacer tu pedido', c: '#2a9d8f', u: function(s){ return chat(s, 'BOT'); } },
  { t: 'Tablero del chat', e: '💬', s: 'Acá encontrarás todos los chats que necesitás para trabajar mejor', c: '#0f6e5f', u: function(s){ return chat(s, ''); } },
  { t: 'Compatibles Glass 9D', e: '🔎', s: 'Consultalo a la IA porque cualquier modelo compatible Glass 9D o protector de cámara u otro', c: '#1d6fd6', u: function(s){ return chat(s, 'COMP9D'); } }
];
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function guardada(){ try { return localStorage.getItem('tiva_suc') || ''; } catch(e){ return ''; } }
function guardar(s){ try { if (s) localStorage.setItem('tiva_suc', s); else localStorage.removeItem('tiva_suc'); } catch(e){} }
var LOGO = '<div class="logo"><img id="lg" src="https://tiva.com.ar/cdn/shop/files/LOGUITO_1b2a8d14-a883-4cc9-a7e7-9f3348145478.png" alt="TIVA"></div>';
function logoFix(){ var i = document.getElementById('lg'); if (!i) return; var f = function(){ i.parentNode.innerHTML = '<b style="color:#0f6e5f;font-size:20px;letter-spacing:2px">TIVA</b>'; }; i.onerror = f; if (i.complete && !i.naturalWidth) f(); }
function pintar(){
  var q = new URLSearchParams(location.search).get('suc');
  var s = (q || guardada()).toUpperCase();
  var el = document.getElementById('app');
  if (!SUCS[s]) {
    var h = '<header><div class="hrow">' + LOGO + '<div><h1>Elegí tu sucursal</h1><p>Se elige una sola vez</p></div></div></header><div class="sucs">';
    Object.keys(SUCS).forEach(function(k){ h += '<button type="button" data-s="' + esc(k) + '">🏪 ' + esc(k) + '</button>'; });
    el.innerHTML = h + '</div>'; logoFix();
    el.querySelectorAll('[data-s]').forEach(function(b){ b.onclick = function(){ guardar(b.getAttribute('data-s')); history.replaceState(null, '', '?suc=' + encodeURIComponent(b.getAttribute('data-s'))); pintar(); }; });
    return;
  }
  guardar(s);
  var g = '<header><div class="hrow">' + LOGO + '<div><h1>' + esc(s) + '</h1><p>Tocá lo que necesitás</p></div><button type="button" id="cambiar">Cambiar sucursal</button></div></header>';
  g += '<div class="panel" id="panel"></div><div class="lista">';
  BOTONES.forEach(function(b){ g += '<a class="card" href="' + esc(b.u(s)) + '" target="_blank" rel="noopener"><div class="ic" style="background:' + b.c + '">' + b.e + '</div><div class="tx"><b>' + esc(b.t) + '</b><small>' + esc(b.s) + '</small></div><div class="ch">›</div></a>'; });
  g += '</div><div class="tip">App TIVA · ' + esc(s) + '</div><div class="aviso" id="aviso"></div>';
  el.innerHTML = g; logoFix(); pintarPanel();
  document.getElementById('cambiar').onclick = function(){ if (confirm('¿Cambiar de sucursal?')) { guardar(''); history.replaceState(null, '', location.pathname); pintar(); } };
  avisosArrancar();
  if (pushOn() && Notification.permission === 'granted') setTimeout(function(){ pushRegistrar(function(){ pintarPanel(); }); }, 1500);   // refresca el registro del celular
  if (new URLSearchParams(location.search).get('abrir') === 'chat') { history.replaceState(null, '', '?suc=' + encodeURIComponent(s)); location.href = chat(s, ''); }   // tocaron el aviso: directo al chat
}

/* ===== 18/10 (Daniel): INSTALAR LA APP + AVISOS CON SONIDO =====
   - Instalar: en Android sale el cartel de Chrome; en iPhone se muestran los pasos (Apple no deja instalar con un botón).
   - Avisos: la app le pregunta al chat cada 15 segundos si llegó un mensaje para este local. Si llegó, suena (mismo
     sonido que el Chat Administración), vibra y muestra un aviso. Funciona mientras la app esté abierta en el celular. */
var INSTALL_EV = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); INSTALL_EV = e; pintarPanel(); });
window.addEventListener('appinstalled', function(){ INSTALL_EV = null; try { localStorage.setItem('tiva_inst', '1'); } catch(e){} pintarPanel(); });
function instalada(){ try { if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return true; return localStorage.getItem('tiva_inst') === '1'; } catch(e){ return false; } }
function esIphone(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent); }
function notifOn(){ try { return localStorage.getItem('tiva_notif') === '1'; } catch(e){ return false; } }
function pintarPanel(){
  var p = document.getElementById('panel'); if (!p) return;
  var h = '';
  if (!instalada()) {
    h += '<div class="pc"><div class="pi">📲</div><div class="pt"><b>Instalá la App TIVA en este celular</b><small>Queda como una app más, con el ícono de TIVA, y abre más rápido.</small></div><button type="button" id="bInst">Instalar</button></div>';
  }
  if (notifOn() && (!('Notification' in window) || Notification.permission === 'granted')) {
    var conPush = pushOn();
    h += '<div class="pc ok"><div class="pi">🔔</div><div class="pt"><b>Avisos con sonido activados</b><small>' + (conPush ? 'Cuando te escriban, el celular suena y avisa aunque la app esté cerrada.' : 'Cuando te escriban, esta app suena y vibra (mientras esté abierta).') + '</small></div><button type="button" id="bProbar">Probar</button></div>';
  } else {
    h += '<div class="pc"><div class="pi">🔔</div><div class="pt"><b>Activá los avisos con sonido</b><small>Para que suene cuando te llegue un mensaje del chat.</small></div><button type="button" id="bNotif">Activar</button></div>';
  }
  p.innerHTML = h;
  var bi = document.getElementById('bInst'); if (bi) bi.onclick = instalar;
  var bn = document.getElementById('bNotif'); if (bn) bn.onclick = activarAvisos;
  var bp = document.getElementById('bProbar'); if (bp) bp.onclick = probarAviso;
}
/* ===== Avisos aunque la app esté cerrada (Firebase) ===== */
var FIREBASE_CONFIG = { apiKey: 'AIzaSyAZNS6RnleazSGHr3-cj9pDd5vgWbo4jFY', authDomain: 'tiva-chat-notificaciones.firebaseapp.com', projectId: 'tiva-chat-notificaciones', storageBucket: 'tiva-chat-notificaciones.firebasestorage.app', messagingSenderId: '37768361854', appId: '1:37768361854:web:48e498b0987853f274252f' };
var FCM_VAPID_KEY = 'BJGWXmahmXOza7Nk2NDpYxUose5ORS3RzDbGt0kMtWbNa5SkWiQPTIpexHX5jfffZnrs80y7_7DuxY8v5W7PKjo';
function pushOn(){ try { return localStorage.getItem('tiva_push') === '1'; } catch(e){ return false; } }
function pushPosible(){ return ('Notification' in window) && ('serviceWorker' in navigator) && window.firebase && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported(); }
function api(q){ return fetch(CHAT.replace('?email=', '?') + q + '&_=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }); }
/* Registra este celular en Firebase y le manda el "token" al chat (hoja PUSH_TOKENS). Se repite en cada apertura para refrescarlo. */
function pushRegistrar(cb){
  var s = guardada(); if (!SUCS[s] || !pushPosible()) { if (cb) cb(false); return; }
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    var msg = firebase.messaging();
    navigator.serviceWorker.register('firebase-messaging-sw.js').then(function(reg){
      return msg.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    }).then(function(token){
      if (!token) { if (cb) cb(false); return; }
      var disp = (navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac/) || ['otro'])[0];
      return api('api=pushtoken&email=' + encodeURIComponent(SUCS[s]) + '&suc=' + encodeURIComponent(s) + '&token=' + encodeURIComponent(token) + '&disp=' + encodeURIComponent(disp)).then(function(r){
        var ok = !!(r && r.ok); try { localStorage.setItem('tiva_push', ok ? '1' : '0'); } catch(e){}
        if (cb) cb(ok);
      });
    }).catch(function(){ if (cb) cb(false); });
    try { msg.onMessage(function(){ ding(); mostrarAviso('📩 Te llegó un mensaje nuevo en el chat'); }); } catch(e){}
  } catch(e){ if (cb) cb(false); }
}
function probarAviso(){
  desbloquear(); ding();
  if (pushOn()) {
    mostrarAviso('🔔 Suena así. En unos segundos también te llega el aviso del celular…');
    var s = guardada();
    api('api=pushprobar&email=' + encodeURIComponent(SUCS[s]) + '&suc=' + encodeURIComponent(s)).then(function(r){
      if (!(r && r.ok)) mostrarAviso('⚠️ No se pudo mandar el aviso de prueba' + (r && r.error ? ': ' + r.error : ''));
    }).catch(function(){});
  } else mostrarAviso('🔔 Así va a sonar cuando te escriban');
}
function instalar(){
  if (INSTALL_EV) { INSTALL_EV.prompt(); INSTALL_EV.userChoice.then(function(){ INSTALL_EV = null; pintarPanel(); }); return; }
  var pasos = esIphone()
    ? '<li>Abrí esta página en <b>Safari</b> (si estás en otro navegador, copiá el link y pegalo en Safari).</li><li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha para arriba, abajo en el medio).</li><li>Deslizá y tocá <b>"Agregar a inicio"</b>.</li><li>Tocá <b>Agregar</b>. Listo: te queda el ícono de TIVA en la pantalla.</li>'
    : '<li>Tocá los <b>tres puntitos ⋮</b> arriba a la derecha de Chrome.</li><li>Tocá <b>"Instalar app"</b> o <b>"Agregar a pantalla principal"</b>.</li><li>Confirmá. Listo: te queda el ícono de TIVA en la pantalla.</li>';
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="bx"><h2>📲 Cómo instalar la App TIVA</h2><ol>' + pasos + '</ol><button type="button">Entendido</button></div>';
  m.querySelector('button').onclick = function(){ m.remove(); try { localStorage.setItem('tiva_inst', '1'); } catch(e){} pintarPanel(); };
  document.body.appendChild(m);
}
/* sonido: el mismo "ding" del Chat Administración (tres notas, dos veces) + vibración */
var AC = null;
function desbloquear(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} }
document.addEventListener('click', desbloquear, true); document.addEventListener('touchstart', desbloquear, true);
function ding(){
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch(e){}
  try {
    desbloquear(); if (!AC) return;
    var t0 = AC.currentTime + 0.02;
    [[0,1046],[0.16,1318],[0.32,1568],[0.75,1046],[0.91,1318],[1.07,1568]].forEach(function(p){
      var o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = p[1]; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, t0 + p[0]); g.gain.exponentialRampToValueAtTime(0.9, t0 + p[0] + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + p[0] + 0.3);
      o.start(t0 + p[0]); o.stop(t0 + p[0] + 0.32);
    });
  } catch(e){}
}
function mostrarAviso(t){ var a = document.getElementById('aviso'); if (!a) return; a.textContent = t; a.style.display = 'block'; clearTimeout(a._t); a._t = setTimeout(function(){ a.style.display = 'none'; }, 6000); }
function activarAvisos(){
  desbloquear();
  var fin = function(){
    try { localStorage.setItem('tiva_notif', '1'); } catch(e){} ding(); pintarPanel(); avisosArrancar();
    mostrarAviso('🔔 Avisos activados. Registrando el celular…');
    pushRegistrar(function(ok){ pintarPanel(); mostrarAviso(ok ? '✅ Listo: va a sonar aunque la app esté cerrada.' : '🔔 Activado. Suena mientras la app esté abierta.'); });
  };
  if ('Notification' in window && Notification.permission !== 'granted') {
    Notification.requestPermission().then(function(p){ if (p !== 'granted') mostrarAviso('Sin permiso del celular igual va a sonar mientras la app esté abierta.'); fin(); }).catch(fin);
  } else fin();
}
var SELLO_AV = null, SELLO_PEND = false, ULT_SON = 0, AV_TIMER = null;
function avisosArrancar(){
  if (AV_TIMER || !notifOn()) return;
  var s = guardada(); if (!SUCS[s]) return;
  var url = CHAT.replace('?email=', '?api=sello&email=') + encodeURIComponent(SUCS[s]) + '&suc=' + encodeURIComponent(s);
  var tick = function(){
    fetch(url + '&_=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(v){
      var p = String(v || '0|0|0').split('|'), a = p[1] || '0', pend = p[2] === '1';
      if (SELLO_AV === null) { SELLO_AV = a; SELLO_PEND = pend; return; }
      if (a !== SELLO_AV) { SELLO_AV = a; ULT_SON = Date.now(); ding(); mostrarAviso('📩 Te llegó un mensaje nuevo en el chat'); notificar(); }
      else if (pend && Date.now() - ULT_SON > 30000) { ULT_SON = Date.now(); ding(); mostrarAviso('📩 Tenés un mensaje sin leer en el chat'); }
      SELLO_PEND = pend;
    }).catch(function(){});
  };
  tick(); AV_TIMER = setInterval(tick, 15000);
}
function notificar(){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var s = guardada();
    var n = new Notification('TIVA · ' + s, { body: 'Te llegó un mensaje nuevo en el chat. Tocá para abrirlo.', icon: 'icon-192.png', tag: 'tiva-chat', renotify: true });
    n.onclick = function(){ window.open(chat(s, ''), '_blank'); n.close(); };
  } catch(e){}
}
pintar();
</script>
</body>
</html>
